name: Deploy static site from template folder to Pages

on:
  push:
    branches: [ main ] # 你项目的主分支

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload template folder content as site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './templates' # ✅这里就是你的template文件夹！
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
